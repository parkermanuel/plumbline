name: Deploy Plumbline
# On every push to main: run the checks, update the database and email function (once their secrets are set), then publish the site.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  backend:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the database
        if: env.SUPABASE_DB_URL != ''
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/setup.sql
      # Without the database password, the same file goes through Supabase's API with the access token the
      # function deploy already uses (setup.sql is safe to run again and again; test/sql.test.mjs runs it twice).
      - name: Update the database (through the Supabase API)
        if: env.SUPABASE_DB_URL == '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          jq -Rs '{query: .}' supabase/setup.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          echo "Supabase answered $code"
          # A token without database permission: say so plainly, and still deploy the functions below
          if [ "$code" = "403" ]; then echo "::warning::The SUPABASE_ACCESS_TOKEN secret can't change the database (it needs Database write). Run supabase/setup.sql in the Supabase SQL editor, or replace the token."; cat /tmp/out.json; exit 0; fi
          if [ "$code" -ge 300 ]; then cat /tmp/out.json; exit 1; fi
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: 2.121.0
      - name: Deploy the email, sweep, payment and coach functions
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          supabase functions deploy plumbline-email --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy plumbline-sweep --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy plumbline-stripe --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy plumbline-coach --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy plumbline-stoa --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          fi
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET"
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" RESEND_API_KEY="$RESEND_API_KEY" SITE_URL="${SITE_URL:-https://plumblineassessment.com}" EMAIL_FROM="Plumbline <plumbline@parkermanuel.com>"
          fi

      - name: Update the database (through a one-time Supabase function)
        # The access token can deploy functions but can't change the database (owner, 28 Oct 2026). So setup.sql is
        # bundled into plumbline-migrate, which runs it over Supabase's own database connection, guarded by a fresh key.
        if: env.SUPABASE_DB_URL == '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("supabase/functions/plumbline-migrate/setup_sql.ts","export default "+JSON.stringify(fs.readFileSync("supabase/setup.sql","utf8"))+";\n")'
          KEY=$(openssl rand -hex 32); echo "::add-mask::$KEY"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" PL_MIGRATE_KEY="$KEY" >/dev/null
          supabase functions deploy plumbline-migrate --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/mig.json -w '%{http_code}' -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/plumbline-migrate" -H "x-migrate-key: $KEY" || echo 000)
            echo "Database update answered $code: $(cat /tmp/mig.json 2>/dev/null | head -c 400)"
            [ "$code" = "200" ] && break
            [ "$code" = "500" ] && exit 1
            sleep 10
          done
          [ "$code" = "200" ] || exit 1
          # Retire the key so the function can't be called again until the next deploy
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" PL_MIGRATE_KEY="retired" >/dev/null

  site:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
