# Builds the Plumbline Android app (a signed .aab for Google Play). Run it from GitHub: Actions → "Android app" → Run workflow.
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64     the upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# The signed bundle is attached to the run as "plumbline-android". Upload it in Play Console → Testing → Internal testing.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.json", "app-shell/**", ".github/workflows/android.yml"]

concurrency: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - name: Copy the app shell and settings into the Android project
        run: npx cap sync android
      - name: Write the upload key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::No upload key yet, so this run builds a test APK you can install on an Android phone instead."; echo "signed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "signed=yes" >> "$GITHUB_OUTPUT"
      - name: Build a test APK (no upload key yet)
        if: steps.key.outputs.signed == 'no'
        working-directory: android
        env:
          PL_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { grep -E "What went wrong|rror|FAIL" -A3 "$RUNNER_TEMP/gradle.log" | head -12 | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'no'
        with:
          name: plumbline-android-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Build the signed bundle
        if: steps.key.outputs.signed == 'yes'
        working-directory: android
        env:
          PL_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          PL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PL_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { grep -E "What went wrong|rror|FAIL" -A3 "$RUNNER_TEMP/gradle.log" | head -12 | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'yes'
        with:
          name: plumbline-android
          path: android/app/build/outputs/bundle/release/*.aab
