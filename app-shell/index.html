<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plumbline</title>
<style>
  :root { --paper: #f7f7f5; --ink: #121212; --ink-2: #4a4a48; --coral: #e8553a; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #121212; --ink: #f2f2ef; --ink-2: #bdbdb8; --coral: #ff6b4a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif; }
  main { min-height: 100%; display: grid; align-content: center; gap: 18px; padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom)); max-width: 30rem; margin: 0 auto; }
  .logo { font-weight: 800; font-size: 34px; letter-spacing: -0.03em; }
  .logo i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); margin-left: 3px; }
  h1 { margin: 12px 0 0; font-size: 28px; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--ink-2); font-size: 17px; line-height: 1.5; }
  button { justify-self: start; margin-top: 6px; min-height: 50px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--coral); color: #fff; font: inherit; font-weight: 650; font-size: 16px; }
</style>
</head>
<body>
<main>
  <span class="logo">plumbline<i></i></span>
  <h1>You're offline</h1>
  <p>Plumbline needs a connection to load. Anything you already answered is saved. Reconnect and tap below to pick up where you left off.</p>
  <button onclick="location.href='https://plumblineassessment.com'">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.href = 'https://plumblineassessment.com'; });</script>
</body>
</html>
